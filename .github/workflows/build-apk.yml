name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 36 SDK Platform & Accept Licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" || sdkmanager "platforms;android-36" || true

      - name: Ensure debug keystore exists
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -e
          rm -f debug.keystore
          if [ -s debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] && [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ] || ! keytool -list -keystore debug.keystore -storepass android >/dev/null 2>&1; then
            rm -f debug.keystore
            keytool -genkeypair \
              -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod 600 debug.keystore
          ls -l debug.keystore
          keytool -list -keystore debug.keystore -storepass android | grep -E "Alias name|SHA1" || true

      - name: Ensure google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ ! -s app/google-services.json ]; then
            if [ -s google-services.json ]; then
              cp google-services.json app/google-services.json
            elif [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            elif [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json || rm -f app/google-services.json
            fi
          fi
          if [ -s app/google-services.json ]; then
            echo "Verified app/google-services.json is present."
          else
            echo "::error::app/google-services.json is missing! Add the GOOGLE_SERVICES_JSON secret in GitHub (Settings -> Secrets and variables -> Actions) or upload google-services.json into app/ and rerun."
            exit 1
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          GRADLE_OPTS: -Djava.awt.headless=true -Dorg.gradle.daemon=false
          APK_UPDATE_URL: ${{ vars.GDRIVE_APK_URL || format('https://github.com/{0}/releases/download/apk-latest/app-debug.apk', github.repository) }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: london-academy-connect-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish Direct APK Download in GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-latest"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "London Academy Connect (Debug APK)" \
            --notes "Automated Debug APK build from commit ${{ github.sha }}"
